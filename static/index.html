<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试用例管理平台</title>
<!-- Vue 3 全局构建版（国内 CDN）：不用 npm 构建，FastAPI 直接托管这个 html 就能跑。
     unpkg.com 在国内时常连不上，换成 BootCDN / 七牛 staticfile 更稳；若仍失败，见下方自托管方案 -->
<script src="https://cdn.bootcdn.net/ajax/libs/vue/3.4.21/vue.global.prod.js"></script>
<script>
  /* 兜底：BootCDN 加载失败时自动再试七牛 staticfile */
  if (!window.Vue) { document.write('<script src="https://cdn.staticfile.org/vue/3.4.21/vue.global.prod.js"><\/script>'); }
</script>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --text:#1f2937; --muted:#8a94a6;
  --accent:#4f46e5; --accent-light:#eef0ff;
  --border:#e6eaf2; --shadow:0 6px 20px rgba(31,41,55,.08);
  --green:#16a34a; --red:#dc2626; --orange:#ea580c; --blue:#2563eb;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:14px;
}

/* ============ 登录页 ============ */
.auth-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,#312e81 0%,#4f46e5 55%,#2563eb 100%);
  padding:20px;
}
.auth-card{
  width:380px; background:var(--panel); border-radius:16px; box-shadow:var(--shadow);
  padding:34px 30px;
}
.auth-card h1{margin:0 0 6px; font-size:22px;}
.auth-card p.sub{margin:0 0 22px; color:var(--muted); font-size:13px;}
.auth-tabs{display:flex; gap:8px; margin-bottom:20px;}
.auth-tabs button{
  flex:1; padding:9px; border:1px solid var(--border); background:#f8fafd;
  border-radius:9px; cursor:pointer; font-size:14px; color:var(--text);
}
.auth-tabs button.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}

/* ============ 表单控件 ============ */
label.fl{display:block; font-size:12.5px; color:var(--muted); margin:12px 0 5px;}
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:9px;
  font-size:13.5px; background:#fbfcfe; color:var(--text); outline:none; font-family:inherit;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent); background:#fff;}
textarea{resize:vertical; min-height:80px; line-height:1.6;}
input:disabled,select:disabled{background:#f1f3f7; color:var(--muted); cursor:not-allowed;}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 16px;
  border:none; border-radius:9px; cursor:pointer; font-size:13.5px;
  background:var(--accent); color:#fff; transition:opacity .15s; font-family:inherit;
}
.btn:hover{opacity:.88;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn.full{width:100%; justify-content:center; padding:11px; margin-top:20px; font-size:14.5px;}
.btn.sm{padding:5px 10px; font-size:12.5px; border-radius:7px;}
.btn.ghost{background:#fff; color:var(--text); border:1px solid var(--border);}
.btn.ghost:hover{border-color:var(--accent); color:var(--accent); opacity:1;}
.btn.danger{background:#fff; color:var(--red); border:1px solid #f3c6c6;}
.btn.danger:hover{background:#fef2f2; opacity:1;}
.btn.green{background:var(--green);}
.btn.orange{background:var(--orange);}

/* ============ 主布局 ============ */
.layout{display:grid; grid-template-columns:220px 1fr; height:100vh;}
.side{
  background:linear-gradient(180deg,#1e1b4b 0%,#312e81 100%);
  color:#c7d0ee; display:flex; flex-direction:column; padding:18px 12px;
}
.side .logo{
  font-size:16px; font-weight:700; color:#fff; padding:4px 10px 16px;
  display:flex; align-items:center; gap:8px; border-bottom:1px solid rgba(255,255,255,.12);
}
.side nav{flex:1; padding-top:14px; display:flex; flex-direction:column; gap:4px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  cursor:pointer; font-size:13.5px; color:#c7d0ee; border:none; background:none; text-align:left;
  font-family:inherit; transition:all .15s;
}
.nav-item:hover{background:rgba(255,255,255,.08); color:#fff;}
.nav-item.active{background:var(--accent); color:#fff; font-weight:600;}
.side .user-box{
  border-top:1px solid rgba(255,255,255,.12); padding-top:12px;
  display:flex; align-items:center; justify-content:space-between; font-size:13px;
}
.side .user-box .u{display:flex; align-items:center; gap:8px; color:#fff;}
.side .user-box .avatar{
  width:28px; height:28px; border-radius:50%; background:var(--accent);
  display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff;
}
.side .user-box button{
  background:none; border:none; color:#c7d0ee; cursor:pointer; font-size:12px; font-family:inherit;
}
.side .user-box button:hover{color:#fff;}

.main{display:flex; flex-direction:column; overflow:hidden;}
.topbar{
  height:56px; background:var(--panel); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 22px; font-size:15px; font-weight:600; flex:0 0 auto;
}
.content{flex:1; overflow-y:auto; padding:20px 22px;}

/* ============ 卡片 / 表格 ============ */
.card{
  background:var(--panel); border-radius:14px; box-shadow:var(--shadow);
  padding:18px; margin-bottom:16px;
}
.card h3{margin:0 0 14px; font-size:14.5px;}
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px;}
.toolbar .spacer{flex:1;}
table{width:100%; border-collapse:collapse;}
th{
  text-align:left; font-size:12.5px; color:var(--muted); font-weight:600;
  padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap;
}
td{padding:10px; border-bottom:1px solid #f1f3f8; font-size:13px; vertical-align:top;}
tr:hover td{background:#f8faff;}
.empty{text-align:center; color:var(--muted); padding:36px 0; font-size:13px;}

/* ============ 徽章 ============ */
.tag{
  display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; font-weight:600;
}
.tag.p0{background:#fee2e2; color:var(--red);}
.tag.p1{background:#ffedd5; color:var(--orange);}
.tag.p2{background:#dbeafe; color:var(--blue);}
.tag.p3{background:#f1f5f9; color:#64748b;}
.tag.pass{background:#dcfce7; color:var(--green);}
.tag.fail{background:#fee2e2; color:var(--red);}
.tag.block{background:#ffedd5; color:var(--orange);}
.tag.ai{background:#ede9fe; color:#7c3aed;}
.tag.manual{background:#f1f5f9; color:#64748b;}
.tag.running{background:#dbeafe; color:var(--blue);}
.tag.done{background:#dcfce7; color:var(--green);}
.tag.pause{background:#f1f5f9; color:#64748b;}
.tag.pending{background:#f1f5f9; color:#94a3b8;}
.tag.t-功能{background:#dbeafe; color:var(--blue);}
.tag.t-接口{background:#cffafe; color:#0e7490;}
.tag.t-兼容{background:#ede9fe; color:#7c3aed;}
.tag.t-性能{background:#fef9c3; color:#a16207;}

/* ============ 仪表盘 ============ */
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px;}
.stat{
  background:var(--panel); border-radius:14px; box-shadow:var(--shadow); padding:16px 18px;
}
.stat .num{font-size:26px; font-weight:700; margin-top:4px;}
.stat .lbl{font-size:12.5px; color:var(--muted);}
.dash-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.rate-bar{height:8px; background:#eef0f6; border-radius:6px; overflow:hidden; margin-top:8px;}
.rate-bar i{display:block; height:100%; background:linear-gradient(90deg,#16a34a,#4ade80);}
.recent-item{
  display:flex; justify-content:space-between; padding:8px 10px;
  background:#f8faff; border-radius:8px; font-size:13px; margin-bottom:6px;
}
.recent-item span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.recent-item span:last-child{color:var(--muted); flex:0 0 auto; margin-left:10px;}

/* ============ 弹窗 ============ */
.mask{
  position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal{
  width:520px; max-width:100%; max-height:88vh; overflow-y:auto;
  background:var(--panel); border-radius:16px; padding:22px 24px; box-shadow:var(--shadow);
}
.modal h3{margin:0 0 4px; font-size:16px;}
.modal p.tip{margin:0 0 8px; color:var(--muted); font-size:12.5px;}
.modal .foot{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}

/* ============ 分页 ============ */
.pager{display:flex; align-items:center; justify-content:flex-end; gap:12px; margin-top:14px; font-size:12.5px; color:var(--muted);}
.pager button{
  padding:5px 12px; border:1px solid var(--border); background:#fff; border-radius:7px;
  cursor:pointer; font-size:12.5px; font-family:inherit;
}
.pager button:disabled{opacity:.4; cursor:not-allowed;}

/* ============ AI 对话 ============ */
.chat-box{display:flex; flex-direction:column; height:calc(100vh - 118px); background:var(--panel); border-radius:14px; box-shadow:var(--shadow); overflow:hidden;}
.chat-head{
  padding:12px 18px; border-bottom:1px solid var(--border); display:flex; gap:10px; align-items:center;
}
.chat-head input{width:200px; padding:6px 10px;}
.chat-msgs{flex:1; overflow-y:auto; padding:20px 22px; display:flex; flex-direction:column; gap:14px;}
.bubble{max-width:76%; padding:11px 14px; border-radius:14px; line-height:1.65; white-space:pre-wrap; word-break:break-word; font-size:13.5px;}
.bubble.user{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px;}
.bubble.ai{align-self:flex-start; background:#f6f8fc; border:1px solid var(--border); border-bottom-left-radius:4px;}
.bubble.ai .cursor{display:inline-block; width:7px; height:15px; background:var(--accent); margin-left:2px; animation:blink .8s infinite; vertical-align:-2px;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
.chat-input{display:flex; gap:10px; padding:14px 16px; border-top:1px solid var(--border);}
.chat-input textarea{flex:1; min-height:46px; max-height:120px;}
.bubble.sys{align-self:center; color:var(--muted); font-size:12px; background:none;}

/* ============ Toast ============ */
.toasts{position:fixed; top:18px; right:18px; z-index:99; display:flex; flex-direction:column; gap:8px;}
.toast{
  padding:10px 16px; border-radius:10px; color:#fff; font-size:13px;
  box-shadow:var(--shadow); animation:slidein .25s; max-width:320px;
}
.toast.ok{background:var(--green);}
.toast.err{background:var(--red);}
.toast.warn{background:var(--orange);}
@keyframes slidein{from{transform:translateX(30px); opacity:0;} to{transform:none; opacity:1;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const { createApp, reactive, nextTick } = Vue;

/* ================= 全局状态（token / 用户名） ================= */
const store = reactive({
  token: localStorage.getItem('token') || '',
  username: localStorage.getItem('username') || '',
  login(token, username) {
    this.token = token; this.username = username;
    localStorage.setItem('token', token);
    localStorage.setItem('username', username);
  },
  logout() {
    this.token = ''; this.username = '';
    localStorage.removeItem('token');
    localStorage.removeItem('username');
  }
});

/* ================= Toast 提示 ================= */
const toasts = reactive([]);
let toastId = 0;
function toast(text, type) {
  const id = ++toastId;
  toasts.push({ id, text, type: type || 'ok' });
  setTimeout(() => {
    const i = toasts.findIndex(t => t.id === id);
    if (i >= 0) toasts.splice(i, 1);
  }, 2600);
}

/* ================= 请求封装 =================
   后端统一返回 {code:0 成功, message, data}；code!=0 时抛异常
   401 → token 失效，自动登出回到登录页 */
async function api(method, url, body) {
  const opt = { method, headers: { 'Content-Type': 'application/json' } };
  if (store.token) opt.headers['Authorization'] = 'Bearer ' + store.token;
  if (body !== undefined) opt.body = JSON.stringify(body);
  const res = await fetch(url, opt);
  if (res.status === 401) { store.logout(); throw new Error('登录已过期，请重新登录'); }
  const json = await res.json().catch(() => ({}));
  if (json.code !== 0) throw new Error(json.message || json.detail || '请求失败');
  return json.data;
}
/* 拼 GET 查询参数，自动跳过空值 */
function withQuery(url, params) {
  const qs = Object.entries(params)
    .filter(([, v]) => v !== null && v !== undefined && v !== '')
    .map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  return qs ? url + '?' + qs : url;
}

/* ================= 分页组件 ================= */
const Pager = {
  props: { page: Number, total: Number, pageSize: Number },
  emits: ['change'],
  computed: {
    lastPage() { return Math.max(1, Math.ceil(this.total / this.pageSize)); }
  },
  template: `
  <div class="pager" v-if="total > 0">
    <button :disabled="page <= 1" @click="$emit('change', page - 1)">上一页</button>
    <span>第 {{ page }} / {{ lastPage }} 页 · 共 {{ total }} 条</span>
    <button :disabled="page >= lastPage" @click="$emit('change', page + 1)">下一页</button>
  </div>`
};

/* ================= 登录 / 注册 ================= */
const AuthView = {
  data() { return { mode: 'login', username: '', password: '', loading: false }; },
  methods: {
    async submit() {
      if (!this.username.trim() || !this.password) return toast('请输入用户名和密码', 'warn');
      this.loading = true;
      try {
        if (this.mode === 'login') {
          const data = await api('POST', '/auth/login',
            { username: this.username.trim(), password: this.password });
          store.login(data.token, this.username.trim());
          toast('登录成功');
        } else {
          await api('POST', '/auth/register',
            { username: this.username.trim(), password: this.password });
          toast('注册成功，请登录');
          this.mode = 'login';
        }
      } catch (e) { toast(e.message, 'err'); }
      this.loading = false;
    }
  },
  template: `
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>🧪 测试用例管理平台</h1>
      <p class="sub">Agentic RAG 驱动的测试资产管理</p>
      <div class="auth-tabs">
        <button :class="{active: mode==='login'}" @click="mode='login'">登录</button>
        <button :class="{active: mode==='register'}" @click="mode='register'">注册</button>
      </div>
      <label class="fl">用户名</label>
      <input type="text" v-model="username" placeholder="请输入用户名" @keyup.enter="submit">
      <label class="fl">密码</label>
      <input type="password" v-model="password" placeholder="请输入密码" @keyup.enter="submit">
      <button class="btn full" :disabled="loading" @click="submit">
        {{ loading ? '请稍候…' : (mode === 'login' ? '登 录' : '注 册') }}
      </button>
    </div>
  </div>`
};

/* ================= 仪表盘 ================= */
const DashboardView = {
  data() { return { d: null }; },
  async mounted() { await this.load(); },
  methods: {
    async load() {
      try { this.d = await api('GET', '/dashboard/overview'); }
      catch (e) { toast(e.message, 'err'); }
    }
  },
  template: `
  <div v-if="d">
    <div class="stat-grid">
      <div class="stat"><div class="lbl">📦 项目总数</div><div class="num">{{ d.project_total }}</div></div>
      <div class="stat"><div class="lbl">📋 用例总数</div><div class="num">{{ d.case_total }}</div></div>
      <div class="stat"><div class="lbl">▶️ 执行次数</div><div class="num">{{ d.exec_total }}</div></div>
      <div class="stat">
        <div class="lbl">✅ 通过率（{{ d.exec_passed }}/{{ d.exec_total }}）</div>
        <div class="num" :style="{color: d.exec_pass_rate >= 80 ? 'var(--green)' : 'var(--orange)'}">{{ d.exec_pass_rate }}%</div>
        <div class="rate-bar"><i :style="{width: d.exec_pass_rate + '%'}"></i></div>
      </div>
    </div>
    <div class="dash-grid">
      <div class="card"><h3>按优先级分布</h3>
        <div class="chips">
          <span v-for="(c, p) in d.by_priority" :key="p" class="tag" :class="'p' + String(p).replace('P','').toLowerCase()">{{ p }} × {{ c }}</span>
          <span v-if="!Object.keys(d.by_priority).length" class="empty">暂无数据</span>
        </div>
      </div>
      <div class="card"><h3>按类型分布</h3>
        <div class="chips">
          <span v-for="(c, t) in d.by_type" :key="t" class="tag" :class="'t-' + t">{{ t }} × {{ c }}</span>
          <span v-if="!Object.keys(d.by_type).length" class="empty">暂无数据</span>
        </div>
      </div>
      <div class="card"><h3>按来源分布</h3>
        <div class="chips">
          <span v-for="(c, s) in d.by_source" :key="s" class="tag" :class="s === 'AI生成' ? 'ai' : 'manual'">{{ s }} × {{ c }}</span>
          <span v-if="!Object.keys(d.by_source).length" class="empty">暂无数据</span>
        </div>
      </div>
    </div>
    <div class="card"><h3>最近创建的用例</h3>
      <div v-if="d.recent_cases.length">
        <div class="recent-item" v-for="c in d.recent_cases" :key="c.id">
          <span>#{{ c.id }} {{ c.title }}</span><span>项目 {{ c.project_id }}</span>
        </div>
      </div>
      <div v-else class="empty">还没有用例，去「测试用例」页创建或 AI 生成吧</div>
    </div>
  </div>`
};

/* ================= 项目管理 ================= */
const ProjectsView = {
  data() {
    return {
      items: [], total: 0, page: 1, pageSize: 10,
      show: false, editingId: null,
      form: { name: '', description: '', status: '进行中' }
    };
  },
  async mounted() { await this.load(); },
  methods: {
    async load() {
      try {
        const data = await api('GET', withQuery('/projects', { page: this.page, page_size: this.pageSize }));
        this.items = data.items; this.total = data.total;
      } catch (e) { toast(e.message, 'err'); }
    },
    turn(p) { this.page = p; this.load(); },
    openCreate() {
      this.editingId = null;
      this.form = { name: '', description: '', status: '进行中' };
      this.show = true;
    },
    openEdit(row) {
      this.editingId = row.id;
      this.form = { name: row.name, description: row.description || '', status: row.status };
      this.show = true;
    },
    async save() {
      if (!this.form.name.trim()) return toast('项目名称不能为空', 'warn');
      try {
        if (this.editingId) {
          await api('PUT', '/projects/' + this.editingId, this.form);
          toast('项目已更新');
        } else {
          await api('POST', '/projects', this.form);
          toast('项目创建成功');
        }
        this.show = false; await this.load();
      } catch (e) { toast(e.message, 'err'); }
    },
    async remove(row) {
      if (!confirm(`确定删除项目「${row.name}」吗？`)) return;
      try {
        await api('DELETE', '/projects/' + row.id);
        toast('已删除');
        if (this.items.length === 1 && this.page > 1) this.page--;
        await this.load();
      } catch (e) { toast(e.message, 'err'); }
    }
  },
  template: `
  <div class="card">
    <div class="toolbar">
      <h3 style="margin:0">项目列表</h3>
      <div class="spacer"></div>
      <button class="btn" @click="openCreate">＋ 新建项目</button>
    </div>
    <table v-if="items.length">
      <thead><tr><th>ID</th><th>名称</th><th>描述</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody>
        <tr v-for="row in items" :key="row.id">
          <td>{{ row.id }}</td>
          <td style="font-weight:600">{{ row.name }}</td>
          <td style="max-width:300px">{{ row.description || '-' }}</td>
          <td><span class="tag" :class="row.status === '进行中' ? 'running' : row.status === '已完成' ? 'done' : 'pause'">{{ row.status }}</span></td>
          <td>{{ row.created_at }}</td>
          <td style="white-space:nowrap">
            <button class="btn sm ghost" @click="openEdit(row)">编辑</button>
            <button class="btn sm danger" @click="remove(row)">删除</button>
          </td>
        </tr>
      </tbody>
    </table>
    <div v-else class="empty">暂无项目，点击右上角新建</div>
    <pager :page="page" :total="total" :page-size="pageSize" @change="turn"></pager>

    <div class="mask" v-if="show" @click.self="show=false">
      <div class="modal">
        <h3>{{ editingId ? '编辑项目' : '新建项目' }}</h3>
        <p class="tip">对应接口：POST /projects、PUT /projects/{id}</p>
        <label class="fl">项目名称 *</label>
        <input type="text" v-model="form.name" placeholder="如：电商 App 兼容测试">

        this.items = data.items; this.total = data.total;

/* ================= AI 助手（SSE 流式） ================= */
const ChatView = {
  data() {
    return {
      threadId: localStorage.getItem('thread_id') || 'session_001',
      messages: [], input: '', streaming: false
    };
  },
  methods: {
    persistThread() { localStorage.setItem('thread_id', this.threadId); },
    async loadHistory() {
      try {
        const data = await api('GET', withQuery('/chat/history', { thread_id: this.threadId }));
        this.messages = data.messages;
        if (!this.messages.length) this.messages = [{ role: 'sys', content: '（该会话暂无历史记录）' }];
        this.scrollBottom();
      } catch (e) { toast(e.message, 'err'); }
    },
    scrollBottom() {
      nextTick(() => {
        const el = this.$refs.msgBox;
        if (el) el.scrollTop = el.scrollHeight;
      });
    },
    async send() {
      const q = this.input.trim();
      if (!q || this.streaming) return;
      this.input = '';
      this.messages.push({ role: 'user', content: q });
      this.messages.push({ role: 'assistant', content: '', streaming: true });
      const aiIndex = this.messages.length - 1;   // 通过下标改 reactive 数组，才能触发视图更新
      this.streaming = true;
      this.scrollBottom();
      try {
        /* EventSource 只支持 GET，POST 流式接口要用 fetch 手动读流 */
        const res = await fetch('/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + store.token },
          body: JSON.stringify({ query: q, thread_id: this.threadId })
        });
        if (res.status === 401) { store.logout(); throw new Error('登录已过期'); }
        if (!res.ok) {
          let msg = '请求失败（' + res.status + '）';
          try { const j = await res.json(); msg = j.detail || j.message || msg; } catch (_) {}
          throw new Error(msg);
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        /* SSE 协议：事件之间用空行（\n\n）分隔，每行以 "data: " 开头 */
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) >= 0) {
            const evt = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            let text = '';
            for (const line of evt.split('\n')) {
              if (line.startsWith('data: ')) text += line.slice(6);
              else if (line.startsWith('data:')) text += line.slice(5);
              else text += line;          // chunk 内容本身带换行的情况
            }
            this.messages[aiIndex].content += text;
            this.scrollBottom();
          }
        }
      } catch (e) {
        this.messages[aiIndex].content += (this.messages[aiIndex].content ? '\n' : '') + '【出错】' + e.message;
        toast(e.message, 'err');
      } finally {
        this.messages[aiIndex].streaming = false;
        this.streaming = false;
        this.scrollBottom();
      }
    }
  },
  template: `
  <div class="chat-box">
    <div class="chat-head">
      <span style="font-weight:600">🤖 AI 测试助手</span>
      <input type="text" v-model="threadId" @change="persistThread" title="会话 ID（checkpoint thread_id），换个 ID 即新会话">
      <button class="btn sm ghost" @click="loadHistory">加载历史</button>
    </div>
    <div class="chat-msgs" ref="msgBox">
      <div v-if="!messages.length" class="bubble sys">
        向 AI 助手提问吧，比如「帮我设计一个登录功能的测试用例」「常用的测试用例设计方法有哪些」
      </div>
      <div v-for="(m, i) in messages" :key="i"
           class="bubble" :class="m.role === 'user' ? 'user' : m.role === 'assistant' ? 'ai' : 'sys'">
        <template v-if="m.role === 'assistant'">{{ m.content }}<span v-if="m.streaming" class="cursor"></span></template>
        <template v-else>{{ m.content }}</template>
      </div>
    </div>
    <div class="chat-input">
      <textarea v-model="input" placeholder="输入问题，Enter 发送（限流 5 次/分钟）"
        @keydown.enter.exact.prevent="send"></textarea>
      <button class="btn" style="align-self:flex-end" :disabled="streaming || !input.trim()" @click="send">
        {{ streaming ? '回答中…' : '发送' }}
      </button>
    </div>
  </div>`
};
